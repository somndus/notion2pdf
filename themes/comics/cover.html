<div class="cover">
  {{#if coverImage}}<div class="cover-art"><img src="{{coverImage}}" alt=""></div><div class="cover-veil"></div>{{/if}}
  <div class="cover-top">
    {{#if logo}}<img class="cover-logo" src="{{logo}}" alt="">{{/if}}
    {{#if subtitle}}<span class="cover-badge">{{subtitle}}</span>{{/if}}
  </div>
  <div class="cover-bottom">
    <h1 class="cover-kicker" data-text="{{title}}"><span class="cover-kicker-fill">{{title}}</span></h1>
    {{#if description}}<p class="cover-description">{{description}}</p>{{/if}}
    <div class="cover-meta">
      {{#if version}}<span class="cover-tag cover-version">{{version}}</span>{{/if}}
      <span class="cover-tag cover-date">{{date}}</span>
      {{#if author}}<span class="cover-tag cover-author">{{author}}</span>{{/if}}
    </div>
  </div>
</div>
